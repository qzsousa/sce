<style>

<script>
  // Limpa o token salvo localmente e volta para a tela de login (doGet sem token).
  function sceLogout() {
    localStorage.removeItem('sce_token');
    top.location.href = getScriptUrlBase_();
  }

  // Reconstrói a URL base do Web App (sem query string) a partir da URL atual.
  function getScriptUrlBase_() {
    return window.location.href.split('?')[0];
  }

  // --- Loading overlay: usado por carregarEquipamentos/carregarEquipamentosGlobal ---
  function sceShowLoading() {
    const el = document.getElementById('sce-loading-overlay');
    if (el) el.classList.add('active');
  }
  function sceHideLoading() {
    const el = document.getElementById('sce-loading-overlay');
    if (el) el.classList.remove('active');
  }

  // --- Exportação CSV: recebe o texto CSV do servidor e dispara o download ---
  function sceBaixarCsv(csvContent, filename) {
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'sce-equipamentos.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // --- Exportação PDF: usa window.print() com CSS específico (ver @media print acima) ---
  function sceExportarPDF() {
    const el = document.getElementById('sce-print-data');
    if (el) el.innerText = 'Gerado em ' + new Date().toLocaleString('pt-BR');
    window.print();
  }

  // ================================================================
// LISTAS COM CASCATA E "OUTRO"

function preencherSelectCategoria(prefixo) {
  if (!window.listasCache || !window.listasCache.categorias) return;
  const select = document.getElementById(prefixo + '-categoria');
  if (!select) return;

  const valorAtual = select.value;
  select.innerHTML = '<option value="" disabled selected>Selecione</option>' +
    window.listasCache.categorias.map(c => `<option value="${c}">${c}</option>`).join('') +
    '<option value="__outro__">Outro...</option>';

  if (valorAtual && window.listasCache.categorias.includes(valorAtual)) {
    select.value = valorAtual;
  } else if (valorAtual === '__outro__') {
    select.value = '__outro__';
    mostrarCampoOutro(prefixo, 'categoria');
  }

  M.FormSelect.init(select);
  // Dispara a mudança para popular marcas (se tiver um valor selecionado que não seja "outro")
  if (select.value && select.value !== '__outro__') {
    popularMarcas(prefixo, select.value);
  } else {
    limparMarcaModelo(prefixo);
  }
}

function popularMarcas(prefixo, categoria) {
  const selectMarca = document.getElementById(prefixo + '-marca');
  if (!selectMarca) return;

  if (!categoria || !window.listasCache || !window.listasCache.marcasPorCategoria[categoria]) {
    // Se não houver categoria selecionada, mostra todas as marcas (ou vazio)
    const marcas = window.listasCache && window.listasCache.marcasPorCategoria ? 
      Object.values(window.listasCache.marcasPorCategoria).flat() : [];
    const unicas = [...new Set(marcas)].sort();
    selectMarca.innerHTML = '<option value="" disabled selected>Selecione a categoria</option>' +
      unicas.map(m => `<option value="${m}">${m}</option>`).join('') +
      '<option value="__outro__">Outro...</option>';
    M.FormSelect.init(selectMarca);
    // Limpa modelos
    const selectModelo = document.getElementById(prefixo + '-modelo');
    if (selectModelo) {
      selectModelo.innerHTML = '<option value="" disabled selected>Selecione a marca</option>';
      M.FormSelect.init(selectModelo);
    }
    return;
  }

  const marcas = window.listasCache.marcasPorCategoria[categoria];
  const valorAtual = selectMarca.value;
  selectMarca.innerHTML = '<option value="" disabled selected>Selecione uma marca</option>' +
    marcas.map(m => `<option value="${m}">${m}</option>`).join('') +
    '<option value="__outro__">Outro...</option>';

  if (valorAtual && marcas.includes(valorAtual)) {
    selectMarca.value = valorAtual;
  } else if (valorAtual === '__outro__') {
    selectMarca.value = '__outro__';
    mostrarCampoOutro(prefixo, 'marca');
  }

  M.FormSelect.init(selectMarca);
  // Popular modelos se houver marca selecionada (não sendo "outro")
  if (selectMarca.value && selectMarca.value !== '__outro__') {
    popularModelos(prefixo, selectMarca.value);
  } else {
    const selectModelo = document.getElementById(prefixo + '-modelo');
    if (selectModelo) {
      selectModelo.innerHTML = '<option value="" disabled selected>Selecione a marca</option>' +
        '<option value="__outro__">Outro...</option>';
      M.FormSelect.init(selectModelo);
    }
  }
}

function popularModelos(prefixo, marca) {
  const selectModelo = document.getElementById(prefixo + '-modelo');
  if (!selectModelo) return;

  if (!marca || !window.listasCache || !window.listasCache.modelosPorMarca[marca]) {
    // Se não houver marca, mostra todos os modelos ou vazio
    const modelos = window.listasCache && window.listasCache.modelosPorMarca ?
      Object.values(window.listasCache.modelosPorMarca).flat() : [];
    const unicos = [...new Set(modelos)].sort();
    selectModelo.innerHTML = '<option value="" disabled selected>Selecione a marca</option>' +
      unicos.map(m => `<option value="${m}">${m}</option>`).join('') +
      '<option value="__outro__">Outro...</option>';
    M.FormSelect.init(selectModelo);
    return;
  }

  const modelos = window.listasCache.modelosPorMarca[marca];
  const valorAtual = selectModelo.value;
  selectModelo.innerHTML = '<option value="" disabled selected>Selecione um modelo</option>' +
    modelos.map(m => `<option value="${m}">${m}</option>`).join('') +
    '<option value="__outro__">Outro...</option>';

  if (valorAtual && modelos.includes(valorAtual)) {
    selectModelo.value = valorAtual;
  } else if (valorAtual === '__outro__') {
    selectModelo.value = '__outro__';
    mostrarCampoOutro(prefixo, 'modelo');
  }

  M.FormSelect.init(selectModelo);
}

function mostrarCampoOutro(prefixo, campo) {
  const containerId = prefixo + '-outro-' + campo;
  const container = document.getElementById(containerId);
  if (container) container.style.display = 'block';
}

function esconderCampoOutro(prefixo, campo) {
  const containerId = prefixo + '-outro-' + campo;
  const container = document.getElementById(containerId);
  if (container) {
    container.style.display = 'none';
    const input = container.querySelector('input');
    if (input) input.value = '';
  }
}

function limparMarcaModelo(prefixo) {
  const selectMarca = document.getElementById(prefixo + '-marca');
  if (selectMarca) {
    selectMarca.innerHTML = '<option value="" disabled selected>Selecione a categoria</option>';
    M.FormSelect.init(selectMarca);
  }
  const selectModelo = document.getElementById(prefixo + '-modelo');
  if (selectModelo) {
    selectModelo.innerHTML = '<option value="" disabled selected>Selecione a marca</option>';
    M.FormSelect.init(selectModelo);
  }
  esconderCampoOutro(prefixo, 'marca');
  esconderCampoOutro(prefixo, 'modelo');
}

// Evento change para os selects
function setupSelectCascata(prefixo) {
  const selectCat = document.getElementById(prefixo + '-categoria');
  const selectMarca = document.getElementById(prefixo + '-marca');
  const selectModelo = document.getElementById(prefixo + '-modelo');

  if (selectCat) {
    selectCat.addEventListener('change', function() {
      const val = this.value;
      if (val === '__outro__') {
        mostrarCampoOutro(prefixo, 'categoria');
        limparMarcaModelo(prefixo);
      } else {
        esconderCampoOutro(prefixo, 'categoria');
        popularMarcas(prefixo, val);
      }
    });
  }

  if (selectMarca) {
    selectMarca.addEventListener('change', function() {
      const val = this.value;
      if (val === '__outro__') {
        mostrarCampoOutro(prefixo, 'marca');
        // Limpa modelos
        const selectModelo = document.getElementById(prefixo + '-modelo');
        if (selectModelo) {
          selectModelo.innerHTML = '<option value="" disabled selected>Selecione a marca</option>';
          M.FormSelect.init(selectModelo);
        }
        esconderCampoOutro(prefixo, 'modelo');
      } else {
        esconderCampoOutro(prefixo, 'marca');
        popularModelos(prefixo, val);
      }
    });
  }

  if (selectModelo) {
    selectModelo.addEventListener('change', function() {
      if (this.value === '__outro__') {
        mostrarCampoOutro(prefixo, 'modelo');
      } else {
        esconderCampoOutro(prefixo, 'modelo');
      }
    });
  }
}

// Função auxiliar para obter o valor final (select ou input "outro")
function getValorCampo(prefixo, campo) {
  const select = document.getElementById(prefixo + '-' + campo);
  if (!select) return '';
  const val = select.value;
  if (val === '__outro__') {
    const input = document.getElementById(prefixo + '-outro-' + campo + '-input');
    return input ? input.value.trim() : '';
  }
  return val;
}

// ================================================================
// DEV PANEL — Profile Test Switcher (Development Only)
// ================================================================
(function() {
  const isDevMode = new URLSearchParams(window.location.search).has('dev') || localStorage.getItem('sce_dev') === '1';
  const panel = document.getElementById('sce-dev-panel');
  if (!panel) return;

  if (isDevMode) {
    panel.classList.add('visible');
    // Load saved dev profile
    const savedProfile = localStorage.getItem('sce_dev_profile');
    const savedFilial = localStorage.getItem('sce_dev_filial');
    const savedEmail = localStorage.getItem('sce_dev_email');
    if (savedProfile) document.getElementById('sce-dev-profile-select').value = savedProfile;
    if (savedFilial) document.getElementById('sce-dev-filial-input').value = savedFilial;
    if (savedEmail) document.getElementById('sce-dev-email-input').value = savedEmail;
  }

  window.sceDevPanelHide = function() {
    panel.classList.remove('visible');
  };

  window.sceDevProfileChange = function(value) {
    const filialInput = document.getElementById('sce-dev-filial-input');
    filialInput.style.display = (value === 'AdminFilial' || value === 'Tecnico') ? 'block' : 'none';
  };

  window.sceDevFilialChange = function(value) {
    localStorage.setItem('sce_dev_filial', value);
  };

  window.sceDevEmailChange = function(value) {
    localStorage.setItem('sce_dev_email', value);
  };

  window.sceDevApplyProfile = function() {
    const profile = document.getElementById('sce-dev-profile-select').value;
    const filial = document.getElementById('sce-dev-filial-input').value;
    const email = document.getElementById('sce-dev-email-input').value;

    if (!profile) { alert('Selecione um perfil'); return; }
    if ((profile === 'AdminFilial' || profile === 'Tecnico') && !filial) { alert('Informe a unidade/filial'); return; }

    localStorage.setItem('sce_dev_profile', profile);
    localStorage.setItem('sce_dev_filial', filial);
    localStorage.setItem('sce_dev_email', email);

    // Create a mock session via server-side endpoint
    const baseUrl = getScriptUrlBase_();
    const params = new URLSearchParams({ dev: '1', profile: profile });
    if (filial) params.set('filial', filial);
    if (email) params.set('email', email);
    window.location.href = baseUrl + '?' + params.toString();
  };

  window.sceDevClearProfile = function() {
    localStorage.removeItem('sce_dev_profile');
    localStorage.removeItem('sce_dev_filial');
    localStorage.removeItem('sce_dev_email');
    document.getElementById('sce-dev-profile-select').value = '';
    document.getElementById('sce-dev-filial-input').value = '';
    document.getElementById('sce-dev-email-input').value = '';
    document.getElementById('sce-dev-filial-input').style.display = 'none';
    M.toast({ html: 'Simulação limpa. Recarregue para voltar ao normal.' });
  };

  // Initialize filial input visibility
  const initialProfile = document.getElementById('sce-dev-profile-select').value;
  if (initialProfile === 'AdminFilial' || initialProfile === 'Tecnico') {
    document.getElementById('sce-dev-filial-input').style.display = 'block';
  }
})();
</script>
