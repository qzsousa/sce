<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root {
    --sce-primary: #1565c0;
    --sce-primary-dark: #0d47a1;
    --sce-primary-light: #e3f0fd;
    --sce-accent: #ef6c00;
    --sce-ink: #1c2733;
    --sce-muted: #64748b;
    --sce-border: #e2e8f0;
    --sce-bg: #f2f5f9;
    --sce-radius: 10px;
    --sce-shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --sce-shadow-md: 0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.06);
  }


  
  * { box-sizing: border-box; }

  html, body {
    background: var(--sce-bg);
    font-family: 'Inter', 'Roboto', -apple-system, sans-serif;
    color: var(--sce-ink);
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Inter', 'Roboto', -apple-system, sans-serif;
    font-weight: 600;
    color: var(--sce-ink);
    letter-spacing: -0.01em;
  }

  /* ---------- Header ---------- */
  .sce-header {
    background: linear-gradient(135deg, var(--sce-primary) 0%, var(--sce-primary-dark) 100%);
    color: white;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--sce-shadow-md);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .sce-header .brand {
    font-weight: 700;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.01em;
  }
  .sce-header .brand .material-icons {
    font-size: 26px;
    background: rgba(255,255,255,.15);
    border-radius: 8px;
    padding: 6px;
  }
  .sce-header .brand .brand-sub {
    display: block;
    font-size: .7rem;
    font-weight: 400;
    opacity: .85;
    letter-spacing: .02em;
  }
  .sce-header .logout-btn {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 500;
    transition: background .15s ease;
  }
  .sce-header .logout-btn:hover { background: rgba(255,255,255,.15); }
  .sce-header .logout-btn .material-icons { font-size: 20px; vertical-align: middle; }

  /* ---------- Layout helpers ---------- */
  .sce-container { padding: 28px; max-width: 1400px; margin: 0 auto; }
  .sce-page-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .sce-page-title .material-icons {
    background: var(--sce-primary-light);
    color: var(--sce-primary-dark);
    border-radius: 10px;
    padding: 8px;
    font-size: 26px;
  }
  .sce-page-title h5 {
    margin: 0;
    font-size: 1.3rem;
  }

  /* ---------- Cards / panels ---------- */
  .card {
    border-radius: var(--sce-radius) !important;
    box-shadow: var(--sce-shadow) !important;
    border: 1px solid var(--sce-border);
  }
  .sce-panel {
    background: white;
    border-radius: var(--sce-radius);
    box-shadow: var(--sce-shadow);
    border: 1px solid var(--sce-border);
    padding: 20px 22px;
    margin-bottom: 22px;
  }
  .sce-panel-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .95rem;
    font-weight: 600;
    color: var(--sce-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 14px;
  }
  .sce-panel-title .material-icons { font-size: 18px; }

  /* ---------- KPI cards ---------- */
  .sce-kpi {
    background: white;
    border: 1px solid var(--sce-border);
    border-radius: var(--sce-radius);
    box-shadow: var(--sce-shadow);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

    /* Cores personalizadas para cada card KPI */
  .kpi-total {
    background-color: #E3F2FD !important;  /* azul bem claro */
    border-left: 4px solid #1565C0;        /* detalhe lateral opcional */
  }

  .kpi-disponiveis {
    background-color: #E8F5E9 !important;  /* verde bem claro */
    border-left: 4px solid #2E7D32;
  }

  .kpi-manutencao {
    background-color: #FFF9C4 !important;  /* amarelo pastel suave */
    border-left: 4px solid #F9A825;
    /* Se quiser um efeito de "desfocado" com backdrop-filter (se houver conteúdo atrás) */
    /* background-color: rgba(255, 235, 59, 0.25) !important; 
      backdrop-filter: blur(4px); */
  }

  .kpi-quebrados {
    background-color: #FFEBEE !important;  /* vermelho bem claro */
    border-left: 4px solid #C62828;
  }

  .sce-kpi 
  .sce-kpi .sce-kpi-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--sce-primary-light);
    color: var(--sce-primary-dark);
    flex-shrink: 0;
  }
  .sce-kpi .sce-kpi-value { font-size: 1.4rem; font-weight: 700; line-height: 1.1; }
  .sce-kpi .sce-kpi-label { font-size: .78rem; color: var(--sce-muted); font-weight: 500; }

  /* ---------- Buttons ---------- */
  .btn, .btn-flat, .btn-small {
    border-radius: 8px !important;
    font-weight: 500;
    letter-spacing: .01em;
    text-transform: none !important;
  }
  .btn, .btn-large { background-color: var(--sce-primary) !important; box-shadow: none !important; }
  .btn:hover, .btn-large:hover { background-color: var(--sce-primary-dark) !important; }
  .btn.red { background-color: #d32f2f !important; }
  .btn.red:hover { background-color: #b71c1c !important; }
  .btn-flat { color: var(--sce-primary-dark) !important; }
  .btn-small.waves-effect { background-color: transparent !important; color: var(--sce-muted) !important; box-shadow: none !important; }
  .btn-small.waves-effect:hover { background-color: var(--sce-primary-light) !important; color: var(--sce-primary-dark) !important; }
  .btn-small.red { color: #d32f2f !important; }
  .btn-small.red:hover { background-color: #ffebee !important; }
  .btn:disabled, .btn-small:disabled, .btn[disabled] {
    background-color: #cbd5e1 !important;
    color: #94a3b8 !important;
    cursor: not-allowed;
  }

  /* ---------- Tables ---------- */
  table.striped, table.highlight {
    border-radius: var(--sce-radius);
    overflow: hidden;
  }
  table.striped thead tr, table.highlight thead tr {
    background: var(--sce-primary-light);
  }
  table.striped thead th, table.highlight thead th {
    color: var(--sce-primary-dark);
    font-weight: 600;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  /* ---------- Modals ---------- */
  .modal { border-radius: var(--sce-radius); }
  .modal .modal-content h5 { color: var(--sce-primary-dark); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }

  /* ---------- Loading overlay ---------- */
  #sce-loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(15,23,42,.45);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  #sce-loading-overlay.active { display: flex; }
  #sce-loading-overlay .sce-spinner-box {
    background: white;
    border-radius: var(--sce-radius);
    padding: 22px 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--sce-shadow-md);
    font-weight: 500;
    color: var(--sce-ink);
  }

  /* ---------- Impressão (Exportar PDF via window.print) ---------- */
  #sce-print-header { display: none; }
  @media print {
    .sce-header, .sce-page-title, #sce-loading-overlay,
    .modal, button, .btn, .btn-flat, .btn-small,
    .no-print { display: none !important; }
    #sce-print-header {
      display: block !important;
      margin-bottom: 16px;
    }
    #sce-print-header h4 { margin: 0 0 4px; }
    #sce-print-header p { margin: 0; color: #555; font-size: .85rem; }
    .sce-panel { box-shadow: none !important; border: none !important; padding: 0 !important; }
    body { background: white !important; }
    .sce-container { padding: 0 !important; }
  }
  /* ==============================================
     ADICIONE OS 3 TEMAS AQUI NO FINAL (SÓ ISSO)
     ============================================== */
  .theme-matriz {
    --sce-primary: #0B1E36;
    --sce-primary-dark: #070f1f;
    --sce-primary-light: #d6dce5;
    --sce-accent: #C9A94E;
    --sce-ink: #1c2733;
    --sce-muted: #64748b;
    --sce-border: #c9c9c9;
    --sce-bg: #fafaf8;
  }

  .theme-filial {
    --sce-primary: #1A5F7A;
    --sce-primary-dark: #0f3d52;
    --sce-primary-light: #d4e4ed;
    --sce-accent: #F28C28;
    --sce-ink: #1c2733;
    --sce-muted: #64748b;
    --sce-border: #c3d4de;
    --sce-bg: #f5fafc;
  }

  .theme-tecnico {
    --sce-primary: #2F3640;
    --sce-primary-dark: #1a1e24;
    --sce-primary-light: #d4d6d9;
    --sce-accent: #E84118;
    --sce-ink: #1c2733;
    --sce-muted: #64748b;
    --sce-border: #cccdcf;
    --sce-bg: #eef0f2;
  }
</style>

<div class="sce-header">
  <span class="brand">
    <i class="material-icons">inventory_2</i>
    <span>
      SCE
      <span class="brand-sub">Sistema de Controle de Equipamentos</span>
    </span>
  </span>
  <span class="logout-btn" onclick="sceLogout()">
    <i class="material-icons">logout</i> Sair
  </span>
</div>

<!-- Overlay de carregamento — controlado por sceShowLoading()/sceHideLoading() -->
<div id="sce-loading-overlay">
  <div class="sce-spinner-box">
    <div class="preloader-wrapper small active">
      <div class="spinner-layer spinner-blue-only">
        <div class="circle-clipper left"><div class="circle"></div></div>
        <div class="gap-patch"><div class="circle"></div></div>
        <div class="circle-clipper right"><div class="circle"></div></div>
      </div>
    </div>
    <span>Carregando...</span>
  </div>
</div>

<!-- Cabeçalho exibido só na impressão/Exportar PDF -->
<div id="sce-print-header">
  <h4>SCE - Relatório de Equipamentos</h4>
  <p id="sce-print-data"></p>
</div>

<script>
  // Limpa o token salvo localmente e volta para a tela de login (doGet sem token).
  function sceLogout() {
    localStorage.removeItem('sce_token');
    top.location.href = getScriptUrlBase_();
  }

  // Reconstrói a URL base do Web App (sem query string) a partir da URL atual.
  function getScriptUrlBase_() {
    return window.location.href.split('?')[0];
  }

  // --- Loading overlay: usado por carregarEquipamentos/carregarEquipamentosGlobal ---
  function sceShowLoading() {
    const el = document.getElementById('sce-loading-overlay');
    if (el) el.classList.add('active');
  }
  function sceHideLoading() {
    const el = document.getElementById('sce-loading-overlay');
    if (el) el.classList.remove('active');
  }

  // --- Exportação CSV: recebe o texto CSV do servidor e dispara o download ---
  function sceBaixarCsv(csvContent, filename) {
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'sce-equipamentos.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // --- Exportação PDF: usa window.print() com CSS específico (ver @media print acima) ---
  function sceExportarPDF() {
    const el = document.getElementById('sce-print-data');
    if (el) el.innerText = 'Gerado em ' + new Date().toLocaleString('pt-BR');
    window.print();
  }
</script>
