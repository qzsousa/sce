<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCE - Sistema de Controle de Equipamentos</title>
  <meta http-equiv="refresh" content="0; url=/login.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Inter', 'Roboto', sans-serif; background: #f2f5f9; }
    .container { text-align: center; padding: 2rem; }
    .spinner { border: 4px solid #e0e0e0; border-top-color: #1565c0; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Redirecionando para o login...</p>
  </div>
  <script>
    // Redireciona para login se não estiver em uma página válida
    if (!window.location.pathname.match(/\/(login|matriz|filial|tecnico)\.html$/)) {
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
