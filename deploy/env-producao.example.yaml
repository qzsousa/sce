# Variaveis NAO sensiveis do backend do SCE (Cloud Run).
#
#   cp env-producao.example.yaml env-producao.yaml
#
# Confirmei quais dessas o server.js realmente le (setembro/2026):
#   server.js        -> SUPABASE_URL, SUPABASE_ANON_KEY, SSO_SECRET,
#                       FRONTEND_URL, SCE_SYNC_KEY, PORT, NODE_ENV
#   supabaseService  -> SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#
# As chaves ficam no Secret Manager (veja secrets.example.env).
# NAO defina PORT aqui: o Cloud Run injeta PORT=8080 e usa esse valor.

env:
  - name: NODE_ENV
    # ATENCAO: server.js:1627 tem default 'development'. Sem isto, a API sobe
    # em modo de desenvolvimento sem voce perceber.
    value: production

  # Dominio do frontend do SCE na Vercel.
  #
  # IMPORTANTE: o server.js:214 monta o redirectUrl do pos-login a partir
  # daqui. Se este valor estiver errado, o usuario autentica com sucesso e cai
  # num dominio morto. O default hardcoded no codigo e sce-ebon.vercel.app, mas
  # o projeto real em uso e sce-nu.vercel.app - por isso o valor e fixado aqui
  # em vez de deixar o default assumir.
  - name: FRONTEND_URL
    value: https://sce-nu.vercel.app

  # ---- Sobre o que NAO precisa ir aqui -------------------------------------
  # GOOGLE_PRIVATE_KEY, GOOGLE_SERVICE_ACCOUNT_EMAIL, GOOGLE_PROJECT_ID e os
  # SPREADSHEET_*_ID sao do fluxo antigo de Google Sheets e NAO sao usados
  # pelo container da API: o googleSheetsService.js so e importado pelos
  # scripts locais (migrate.js, find-duplicados.js, diagnostico-migracao.js),
  # e nao pelo server.js. Se voce mover esses scripts para a nuvem, inclua-os
  # de volta e use o Secret Manager para a private key (que e multilinha e
  # quebra em --set-env-vars).
