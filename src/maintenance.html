<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCE - Manutenção</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/u/0/d/1R-7mJ0Eb6Kxfi_NucEOZ9AzW4xz0PnaP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #eef4fb 0%, #dce8f8 100%);
      color: #1f2937;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(16,24,40,.12);
      padding: 40px 36px;
      max-width: 460px;
      width: 90%;
      text-align: center;
    }
    .logo { height: 72px; width: auto; margin-bottom: 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; color: #1565c0; }
    p { margin: 8px 0; line-height: 1.55; color: #4b5563; }
    .window {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #f3f6fb;
      font-weight: 600;
      color: #1565c0;
    }
    .foot { margin-top: 20px; font-size: .82rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://lh3.googleusercontent.com/u/0/d/1R-7mJ0Eb6Kxfi_NucEOZ9AzW4xz0PnaP" alt="URE Leste 3" onerror="this.style.display='none'">
    <h1>Sistema em manutenção</h1>
    <p>O SCE estará temporariamente indisponível para manutenção programada.</p>
    <div class="window">Manutenção: 17:00 às 20:00</div>
    <p>Por favor, tente novamente após esse horário. Pedimos desculpas pelo inconveniente.</p>
    <div class="foot">SCE - Sistema de Controle de Equipamentos · URE Leste 3</div>
  </main>
</body>
</html>
