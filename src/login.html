<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="https://sce-nyjc.onrender.com/api">

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="./shared/css/main.css">

  <style>
    body {
      background: radial-gradient(circle at top left, #e3f0fd 0%, #f2f5f9 45%, #f2f5f9 100%);
      min-height: 100vh;
    }
    .sce-login-wrap {
      max-width: 420px;
      margin: 64px auto;
      padding: 0 16px;
    }
    .sce-login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      text-align: center;
    }
    .sce-login-logo .material-icons {
      font-size: 34px;
      color: white;
      background: linear-gradient(135deg, var(--sce-primary) 0%, var(--sce-primary-dark) 100%);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--sce-shadow-md);
    }
    .sce-login-logo h5 { margin: 0; font-size: 1.15rem; color: var(--sce-ink); }
    .sce-login-logo p { margin: 2px 0 0; color: var(--sce-muted); font-size: .85rem; }

    .sce-login-card {
      padding: 34px 30px 26px;
      border-radius: 14px !important;
      box-shadow: var(--sce-shadow-md) !important;
    }
    .sce-login-card h5 {
      font-size: 1.05rem;
      margin: 0 0 6px;
      color: var(--sce-ink);
    }
    .sce-login-card .input-field { margin-bottom: 14px; }
    .sce-login-card .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sce-login-steps {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
    }
    .sce-login-step {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .78rem;
      font-weight: 500;
      color: var(--sce-muted);
    }
    .sce-login-step .num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--sce-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .72rem;
      font-weight: 700;
      flex-shrink: 0;
      background: white;
    }
    .sce-login-step.active .num {
      border-color: var(--sce-primary);
      background: var(--sce-primary);
      color: white;
    }
    .sce-login-step.done .num {
      border-color: #43a047;
      background: #43a047;
      color: white;
    }
    .sce-login-step-sep {
      width: 20px;
      height: 2px;
      background: var(--sce-border);
      flex-shrink: 0;
    }

    #feedback {
      min-height: 20px;
      font-size: .88rem;
      text-align: center;
      margin-top: 12px;
    }
    #feedback.is-error { color: #c62828; }
    #feedback.is-success { color: #2e7d32; }
    #feedback.is-info { color: var(--sce-muted); }
  </style>
</head>
<body>
  <div class="sce-login-wrap">
    <div class="sce-login-logo">
      <i class="material-icons">inventory_2</i>
      <h5>SCE - Leste 3</h5>
      <p>Sistema de Controle de Equipamentos</p>
    </div>

    <div class="card sce-login-card">
      <div class="sce-login-steps">
        <div class="sce-login-step active" id="step-1">
          <span class="num">1</span>
          <span>E-mail</span>
        </div>
        <div class="sce-login-step-sep"></div>
        <div class="sce-login-step" id="step-2">
          <span class="num">2</span>
          <span id="step-2-label">Senha</span>
        </div>
      </div>

      <h5 id="titulo-card"><i class="material-icons left" style="vertical-align:middle;color:var(--sce-primary);">login</i>Entrar</h5>
      <p id="subtitulo" style="margin:0 0 16px;color:var(--sce-muted);font-size:.85rem;">
        Use seu e-mail institucional e senha.
      </p>

      <div class="input-field">
        <i class="material-icons prefix" style="color:var(--sce-muted);">alternate_email</i>
        <input type="email" id="email" autocomplete="email" placeholder="seu.email@instituicao.org">
      </div>

      <div class="input-field">
        <i class="material-icons prefix" style="color:var(--sce-muted);">lock_outline</i>
        <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha">
        <i class="material-icons pwd-toggle" data-target="password" title="Mostrar/ocultar senha" style="position:absolute; right:8px; top:14px; cursor:pointer; color:var(--sce-muted);">visibility</i>
      </div>

      <div class="input-field" id="campo-confirmar" style="display:none;">
        <i class="material-icons prefix" style="color:var(--sce-muted);">lock</i>
        <input type="password" id="confirm-password" autocomplete="new-password" placeholder="Confirme sua senha">
        <i class="material-icons pwd-toggle" data-target="confirm-password" title="Mostrar/ocultar senha" style="position:absolute; right:8px; top:14px; cursor:pointer; color:var(--sce-muted);">visibility</i>
      </div>

      <button class="btn waves-effect" id="btn-entrar">
        <i class="material-icons">login</i><span id="btn-entrar-texto">Entrar</span>
      </button>

      <div id="feedback"></div>
    </div>
  </div>

  <div id="sce-loading-overlay">
    <div class="sce-spinner-box">
      <div class="preloader-wrapper small active">
        <div class="spinner-layer spinner-blue-only">
          <div class="circle-clipper left"><div class="circle"></div></div>
          <div class="gap-patch"><div class="circle"></div></div>
          <div class="circle-clipper right"><div class="circle"></div></div>
        </div>
      </div>
      <span>Carregando...</span>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
