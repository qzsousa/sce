<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="https://sce-nyjc.onrender.com/api">

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../shared/css/main.css">
  <style>
    body {
      background: radial-gradient(circle at top left, #e3f0fd 0%, #f2f5f9 45%, #f2f5f9 100%);
      min-height: 100vh;
    }
    .sce-login-wrap {
      max-width: 420px;
      margin: 64px auto;
      padding: 0 16px;
    }
    .sce-login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      text-align: center;
    }
    .sce-login-logo .material-icons {
      font-size: 34px;
      color: white;
      background: linear-gradient(135deg, var(--sce-primary) 0%, var(--sce-primary-dark) 100%);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--sce-shadow-md);
    }
    .sce-login-logo h5 { margin: 0; font-size: 1.15rem; }
    .sce-login-logo p { margin: 2px 0 0; color: var(--sce-muted); font-size: .85rem; }

    .sce-login-card {
      padding: 34px 30px 26px;
      border-radius: 14px !important;
      box-shadow: var(--sce-shadow-md) !important;
    }
    .sce-login-card h5 {
      font-size: 1.05rem;
      margin: 0 0 6px;
      color: var(--sce-ink);
    }
    .sce-login-card .input-field { margin-bottom: 14px; }
    .sce-login-card .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #feedback {
      min-height: 20px;
      font-size: .88rem;
      text-align: center;
      margin-top: 12px;
    }
    #feedback.is-error { color: #c62828; }
    #feedback.is-success { color: #2e7d32; }
    #feedback.is-info { color: var(--sce-muted); }
  </style>
  <script type="module" crossorigin src="/assets/login-Bvfcx3Zw.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/auth-Bbv3uxjy.js">
</head>
<body>
  <div class="sce-login-wrap">
    <div class="sce-login-logo">
      <i class="material-icons">inventory_2</i>
      <h5>SCE - Leste 3</h5>
      <p>Sistema de Controle de Equipamentos</p>
    </div>

    <div class="card sce-login-card">
      <h5><i class="material-icons left" style="vertical-align:middle;color:var(--sce-primary);">login</i>Entrar</h5>
      <p style="margin:0 0 16px;color:var(--sce-muted);font-size:.85rem;">
        Use seu e-mail institucional e senha.
      </p>

      <div class="input-field">
        <i class="material-icons prefix" style="color:var(--sce-muted);">alternate_email</i>
        <input type="email" id="email" autocomplete="email" placeholder="seu.email@instituicao.org">
        <label for="email">E-mail institucional</label>
      </div>

      <div class="input-field">
        <i class="material-icons prefix" style="color:var(--sce-muted);">lock_outline</i>
        <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha">
        <label for="password">Senha</label>
      </div>

      <button class="btn waves-effect" id="btn-entrar">
        <i class="material-icons">login</i>Entrar
      </button>

      <div id="feedback"></div>
    </div>
  </div>

</body>
</html>
